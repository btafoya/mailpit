version: '3.8'

services:
  mailsandbox:
    build: .
    # or use: image: axllent/mailsandbox:latest (when available)
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
      - "8026:8026"   # MCP server (WebSocket)
    environment:
      # Basic MailSandbox configuration
      MP_DATA_FILE: /data/mailsandbox.db
      MP_SMTP_AUTH_ACCEPT_ANY: true
      MP_SMTP_AUTH_ALLOW_INSECURE: true
      
      # Postmark API emulation
      MP_POSTMARK_API: true
      MP_POSTMARK_TOKEN: your-secret-token-here
      # MP_POSTMARK_ACCEPT_ANY: true  # Uncomment for mainment
      
      # MCP server for AI assistants
      MP_MCP_SERVER: true
      MP_MCP_TRANSPORT: websocket
      MP_MCP_HTTP_ADDR: ":8026"
      MP_MCP_AUTH_TOKEN: your-mcp-token-here
    volumes:
      - mailsandbox-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["/mailsandbox", "readyz"]
      interval: 15s
      timeout: 3s
      retries: 3

  # Example application using Postmark API
  example-app:
    image: node:18-alpine
    depends_on:
      - mailsandbox
    environment:
      # Configure app to use MailSandbox instead of real Postmark
      POSTMARK_SERVER_TOKEN: your-secret-token-here
      POSTMARK_API_URL: http://mailsandbox:8025
    volumes:
      - ./example:/app
    working_dir: /app
    command: npm start
    profiles: ["example"]

volumes:
  mailsandbox-data: